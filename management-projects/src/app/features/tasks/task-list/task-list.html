<p-table [value]="tasks()" dataKey="id" [loading]="loading()" [paginator]="true" [rows]="10">
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Estado</th>
      <th>Asignado</th>
      <th>Inicio</th>
      <th>Fin</th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-task>
    <tr>
      <td>{{ task.name }}</td>
      <td>{{ task.description }}</td>
      <td>
        <p-tag [value]="getStatusLabel(task.status)" [severity]="getSeverity(task.status)" />
      </td>
      <td>{{ task.assignedName }}</td>
      <td>{{ formatDate(task.startAt) }}</td>
      <td>{{ formatDate(task.finishAt) }}</td>
      <td>
        <div class="flex gap-1">
          <button pButton icon="pi pi-pencil" severity="info" rounded text (click)="editTask.emit(task.id)"></button>
          <button pButton icon="pi pi-trash" severity="danger" rounded text (click)="deleteTask.emit(task.id)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="7">No tasks found.</td>
    </tr>
  </ng-template>
</p-table>
