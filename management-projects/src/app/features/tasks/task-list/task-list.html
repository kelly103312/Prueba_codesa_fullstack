<p-table #dt [value]="tasks()" dataKey="id" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [loading]="loading()" [paginator]="true" [globalFilterFields]="['name', 'description', 'assignedName', 'status']">
  <ng-template #caption>
    <div class="flex align-items-center w-full">
      <div class="flex align-items-center gap-3">
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input type="text" [(ngModel)]="searchValue" pInputText placeholder="Busca palabras clave" (input)="dt.filterGlobal($event.target.value, 'contains')"/>
        </p-iconfield>
        <button pButton variant="outlined" icon="pi pi-filter-slash" (click)="dt.clear(); searchValue = ''"> </button>
        @if (showAddButton()) {
          <button pButton variant="outlined" icon="pi pi-plus" (click)="addTask.emit()"> </button>
        }
      </div>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th>
        <div class="flex items-center align-items-center">
          Nombre
          <p-column-filter type="text" field="name" display="menu" />
        </div>
      </th>
      <th>
        <div class="flex items-center align-items-center">
          Descripción
          <p-column-filter type="text" field="description" display="menu" />
        </div>
      </th>
      <th style="min-width: 10rem">
        <div class="flex items-center align-items-center">
          Estado
          <p-column-filter field="status" matchMode="equals" display="menu">
            <ng-template #filter let-value let-filter="filterCallback">
              <p-select [ngModel]="value" [options]="filterOptions" optionLabel="label" optionValue="value" (onChange)="filter($event.value)" placeholder="Selecciona" class="w-full">
                <ng-template let-option #item>
                  <p-tag [value]="option.label" [severity]="getSeverity(option.value)" />
                </ng-template>
              </p-select>
            </ng-template>
          </p-column-filter>
        </div>
      </th>
      <th>
        <div class="flex items-center align-items-center">
          Asignado
          <p-column-filter type="text" field="assignedName" display="menu" />
        </div>
      </th>
      <th style="min-width: 10rem">
        <div class="flex items-center align-items-center">
          Inicio
          <p-column-filter type="date" field="startAt" display="menu" />
        </div>
      </th>
      <th style="min-width: 10rem">
        <div class="flex items-center align-items-center">
          Fin
          <p-column-filter type="date" field="finishAt" display="menu" />
        </div>
      </th>
      <th style="min-width: 8rem">
        <div class="flex items-center align-items-center">
          Acciones
        </div>
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-task>
    <tr>
      <td>
        <span class="font-medium">{{ task.name }}</span>
      </td>
      <td>
        <span class="text-sm">{{ task.description }}</span>
      </td>
      <td>
        <p-tag [value]="getStatusLabel(task.status)" [severity]="getSeverity(task.status)" />
      </td>
      <td>{{ task.assignedName }}</td>
      <td>{{ formatDate(task.startAt) }}</td>
      <td>{{ formatDate(task.finishAt) }}</td>
      <td>
        <div class="flex gap-1">
          <button pButton icon="pi pi-pencil" severity="info" rounded text (click)="editTask.emit(task.id)"></button>
          <button pButton icon="pi pi-trash" severity="danger" rounded text (click)="deleteTask.emit(task.id)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="7">No se encontraron tareas.</td>
    </tr>
  </ng-template>
</p-table>
